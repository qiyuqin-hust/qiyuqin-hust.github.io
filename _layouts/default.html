<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>
  <body id="top">
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include masthead.html %}
    <div id="main">
      <aside class="sidebar" aria-label="Profile">{% include author-profile.html %}</aside>
      <main id="main-content" class="page" tabindex="-1">
        <div class="page__inner-wrap"><div class="page__content">{{ content }}</div></div>
      </main>
    </div>
    <footer class="homepage-footer">
      <span>&copy; {{ site.time | date: '%Y' }} {{ site.author.name | escape }} · <a href="https://github.com/RayeRen/acad-homepage.github.io">AcadHomepage</a></span>
      <a href="#top">Back to top &uarr;</a>
    </footer>
  </body>
</html>
