  I am a first-year Ph.D. student (enrolled in 2026; expected graduation: 2030) in the [School of Computer Science and Technology](https://cs.hust.edu.cn/)
  at [Huazhong University of Science and Technology (HUST)](https://www.hust.edu.cn/),
