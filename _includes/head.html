<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ site.title | escape }} | Academic Homepage</title>
<meta name="description" content="{{ site.description | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ site.title | escape }} | Academic Homepage">
<meta property="og:description" content="{{ site.description | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<link rel="icon" type="image/svg+xml" href="{{ '/images/favicon.svg' | relative_url }}">
<meta name="theme-color" content="#ffffff">
