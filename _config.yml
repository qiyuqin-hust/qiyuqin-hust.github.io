  cv: ""

include:
  - _pages
exclude:
  - README.md
  - PROFILE-TEMPLATE.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - run_server.sh
  - .github
  - vendor
  - node_modules
  - assets/README.md
  - images/README.md
  - files/README.md
  - assets/js
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
sass:
  sass_dir: _sass
  style: compressed
plugins:
  - jekyll-sitemap
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true
